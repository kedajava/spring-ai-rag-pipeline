spring:
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.7
      embedding:
        options:
          model: text-embedding-3-small
management:
  endpoints:
    web:
      exposure:
        include: health, metrics, prometheus
      cors:
        allowed-origins: "*"
        allowed-methods: GET
        allowed-headers: "*"

  metrics:
    export:
      prometheus:
        enabled: true